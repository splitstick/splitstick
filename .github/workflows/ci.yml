name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # TRC-03 — the red-team suite as a regression canary in both directions: it
  # fails if a gap we closed reopens, and if a gap upstream closed is still
  # recorded here as open.
  canary:
    name: red-team canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Tamper suite against OMA's own verifier
        run: npm run generate && npm run redteam
      - name: Tamper suite against splitstick verify
        run: npm run redteam:splitstick
      - name: Requirements traceability
        run: npm run backlog
      - name: Specification review gate
        run: npm run review
      - name: Verifier vocabulary
        run: npm run lint
      - name: Generated files are up to date
        run: git diff --exit-code -- requirements/MATRIX.md requirements/PLAN.md requirements/DESIGN.md

  # NFR-08 — Node 20 and later, tested across supported majors rather than
  # asserted. The unit suite is where the record format, the chain, the tree and
  # the verifier are pinned to their conformance vectors.
  unit:
    name: unit tests · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  # NFR-01, NFR-02 — measured, not assumed. The budgets are reported rather than
  # gated: a laptop and a shared runner disagree with each other by a factor of
  # two at p99, so a hard threshold here would fail for reasons that have nothing
  # to do with the change under review. The numbers are in the log for every run.
  budgets:
    name: performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Append overhead
        run: node bench/append.mjs --events 20000 --repeat 3
        # 20k not 1e6: a shared runner is not NFR-01's reference environment, so
        # this is a continuous regression metric, not the acceptance measurement.
        # `npm run bench:append` runs the full 1e6 the requirement specifies.
      - name: Added run latency
        run: node bench/run-latency.mjs --runs 60

  # GOV-02 — DCO. Pull requests only: commits predating adoption are unsigned,
  # and their sole author affirms them in CONTRIBUTING.md rather than rewriting
  # history that is already pushed.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit in the pull request
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin "$BASE"
          fail=0
          for sha in $(git rev-list --no-merges "origin/$BASE..HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "ok   $sha  $author"
            else
              echo "FAIL $sha  missing or mismatched sign-off for: $author"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo
            echo "Every commit needs a Signed-off-by line matching its author."
            echo "Add it with 'git commit -s', or repair the branch with:"
            echo "  git rebase --signoff origin/$BASE"
            exit 1
          fi
