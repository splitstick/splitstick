name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # TRC-03 — the red-team suite as a regression canary in both directions: it
  # fails if a gap we closed reopens, and if a gap upstream closed is still
  # recorded here as open.
  canary:
    name: red-team canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Tamper suite against OMA's own verifier
        run: npm run generate && npm run redteam
      - name: Tamper suite against splitstick verify
        run: npm run redteam:splitstick
      - name: Requirements traceability
        run: npm run backlog
      - name: Specification review gate
        run: npm run review
      - name: Verifier vocabulary, packaging, and the claims audit
        run: npm run lint
      - name: Claims audit against the scope guards
        # TRC-05, as a step of its own so the gate names the thing it checked.
        # Also in `npm run lint` above; duplicated deliberately, because the
        # requirement is "run a claims audit before each release" and a
        # requirement discharged only as a side effect of another step is one
        # somebody removes while tidying.
        run: npm run claims
      - name: The lockfile matches the workspaces
        # `npm ci` above already proves this, but it proves it by failing the
        # whole job at step one with an npm error. This says which package.
        run: node tools/lint-packaging.mjs
      - name: Generated files are up to date
        run: git diff --exit-code -- requirements/MATRIX.md requirements/PLAN.md requirements/DESIGN.md

  # NFR-08 — Node 20 and later, tested across supported majors rather than
  # asserted. The unit suite is where the record format, the chain, the tree and
  # the verifier are pinned to their conformance vectors.
  unit:
    name: unit tests · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Types
        run: npm run typecheck
      # The output is kept, because an intermittent failure once cost a pull
      # request a red run and the evidence was gone before anybody could read
      # it: the obvious next move is to press re-run, and a green re-run leaves
      # nothing behind. `set -o pipefail` is on by default in these steps, so
      # `tee` does not swallow the exit code.
      - name: Unit tests
        run: npm run test:unit 2>&1 | tee "test-node-${{ matrix.node }}.log"
      - name: The failing assertions, in the step that failed
        if: failure()
        # Before the artifact, because a summary a reader can see without
        # downloading anything is what they actually needed.
        run: |
          echo "::group::failures on node ${{ matrix.node }}"
          grep -E "^not ok|AssertionError|Error:|error:" "test-node-${{ matrix.node }}.log" \
            | head -40 || echo "(no assertion lines matched; see the artifact)"
          echo "::endgroup::"
      - name: Keep the output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-node-${{ matrix.node }}
          path: test-node-${{ matrix.node }}.log
          retention-days: 30

  # NFR-10 — @open-multi-agent/core 1.21.x, tested at BOTH ENDS of the declared
  # range rather than at the one patch release the lockfile happens to pin.
  # peerDependencies is a promise to whoever installs, and an installer may
  # resolve the lowest 1.21 as easily as the highest; a single pinned patch
  # passing is a seam exercised once.
  #
  # The declarations themselves (the peer range, the root pin, the README prose)
  # are checked against each other by packages/collect-oma/test/version.test.mjs,
  # which runs in the unit job. This is the part that needs the registry.
  oma-range:
    name: OMA range · ${{ matrix.oma }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lowest and highest published 1.21.x, resolved below and asserted to
        # differ — a matrix that tested one version twice would look like
        # coverage and be none.
        oma: ['lowest', 'highest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Resolve the ${{ matrix.oma }} published 1.21.x
        id: pick
        run: |
          set -euo pipefail
          RANGE="$(node -p "require('./packages/collect-oma/package.json').peerDependencies['@open-multi-agent/core']")"
          echo "declared range: $RANGE"
          ALL="$(npm view "@open-multi-agent/core@$RANGE" version --json)"
          echo "published in range: $ALL"
          V="$(node -e '
            const all = JSON.parse(process.argv[1]);
            const list = Array.isArray(all) ? all : [all];
            if (list.length === 0) throw new Error("no published version satisfies the declared range");
            // Sorted by the registry already, but sort explicitly: relying on
            // the order a service happens to return is not a pin.
            list.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            const which = process.argv[2];
            if (which === "lowest") process.stdout.write(String(list[0]));
            else process.stdout.write(String(list[list.length - 1]));
          ' "$ALL" "${{ matrix.oma }}")"
          echo "chose: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "count=$(node -e 'const a=JSON.parse(process.argv[1]);process.stdout.write(String((Array.isArray(a)?a:[a]).length))' "$ALL")" >> "$GITHUB_OUTPUT"
      - name: The range has two ends
        if: steps.pick.outputs.count == '1'
        run: |
          echo "Only one 1.21.x is published, so 'lowest' and 'highest' are the same release."
          echo "That is not a failure — it is said out loud so this job is not mistaken for"
          echo "coverage of a range it cannot yet cover."
      - name: Install ${{ steps.pick.outputs.version }}
        run: npm install --no-save "@open-multi-agent/core@${{ steps.pick.outputs.version }}"
      - name: The installed version is the one chosen
        run: |
          set -euo pipefail
          GOT="$(node -p "require('@open-multi-agent/core/package.json').version")"
          echo "installed: $GOT"
          test "$GOT" = "${{ steps.pick.outputs.version }}"
      - name: OMA integration suite
        run: node --test packages/collect-oma/test/*.test.mjs
      - name: Tamper suite against OMA's own verifier
        run: npm run generate && npm run redteam

  # NFR-01, NFR-02 — measured, not assumed. The budgets are reported rather than
  # gated: a laptop and a shared runner disagree with each other by a factor of
  # two at p99, so a hard threshold here would fail for reasons that have nothing
  # to do with the change under review. The numbers are in the log for every run.
  budgets:
    name: performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Append overhead
        run: node bench/append.mjs --events 20000 --repeat 3
        # 20k not 1e6: a shared runner is not NFR-01's reference environment, so
        # this is a continuous regression metric, not the acceptance measurement.
        # `npm run bench:append` runs the full 1e6 the requirement specifies.
      - name: Added run latency
        run: node bench/run-latency.mjs --runs 60

  # GOV-02 — DCO. Pull requests only: commits predating adoption are unsigned,
  # and their sole author affirms them in CONTRIBUTING.md rather than rewriting
  # history that is already pushed.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit in the pull request
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin "$BASE"
          fail=0
          for sha in $(git rev-list --no-merges "origin/$BASE..HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            if git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "ok   $sha  $author"
            else
              echo "FAIL $sha  missing or mismatched sign-off for: $author"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo
            echo "Every commit needs a Signed-off-by line matching its author."
            echo "Add it with 'git commit -s', or repair the branch with:"
            echo "  git rebase --signoff origin/$BASE"
            exit 1
          fi
