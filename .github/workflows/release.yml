# SEC-22, SEC-23, DES-17 — release provenance, signatures and an SBOM.
#
# The point of this workflow is a chain a reader can walk without asking us for
# anything: a published package digest leads to an attestation, the attestation
# leads to this workflow run and the commit it built from, and the SBOM says
# what went into it with every version pinned. M4's heartbeat records a build
# digest; that digest is worth nothing unless it can be traced back here.
#
# Only first-party actions are used. A release workflow that pulls a third-party
# action into the step that signs the artifact has given that action's author a
# say in what gets signed.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, attest and attach artifacts without publishing to npm'
        type: boolean
        default: true

permissions:
  contents: write      # attach the SBOM and tarballs to the release
  id-token: write      # npm provenance and build attestations, via OIDC
  attestations: write

jobs:
  release:
    name: build, attest, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install from the lockfile
        run: npm ci

      # Nothing is published that has not passed the gates. A release is the one
      # moment where skipping them is most tempting and least defensible.
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Tamper suite against OMA's own verifier
        run: npm run generate && npm run redteam
      - name: Tamper suite against splitstick verify
        run: npm run redteam:splitstick
      - name: Requirements traceability
        run: npm run backlog
      - name: Specification review gate
        run: npm run review
      # These three were missing, under a comment saying nothing is published
      # that has not passed the gates. The claims audit ran on every push and
      # pull request and not on the tag that actually publishes — so TRC-04's
      # "release gate blocks on missing benchmark" and TRC-05's "run a claims
      # audit before each release" were both enforced everywhere except at a
      # release.
      - name: Verifier vocabulary, packaging, claims and scope guards
        run: npm run lint
      - name: Claims audit against the scope guards
        # TRC-05 as a step of its own. Also inside `npm run lint`; duplicated
        # deliberately, because a requirement discharged only as a side effect
        # of another step is one somebody removes while tidying.
        run: npm run claims
      - name: The tag may not claim an unfinished release
        # TRC-04, TRC-05. Every individual surface can be honest about an open
        # requirement and a `1.0.0` on npm still says "this is 1.0" more loudly
        # than any README can qualify. A pre-1.0 version claims nothing and
        # passes.
        #
        # EVERY INPUT IS PASSED EXPLICITLY, because the first version took only
        # the ref name and treated anything unparseable as "claims nothing" —
        # so a manual run on `main` with `dry_run: false`, which reaches the
        # publish step below, sailed through it. The gate now refuses a branch,
        # refuses a ref that is not a strict version tag, and refuses a tag the
        # package manifests do not carry. A dry run publishes nothing and is
        # always allowed.
        run: |
          node tools/lint-release.mjs --gate "${{ github.ref_name }}" \
            --ref-type "${{ github.ref_type }}" \
            --dry-run "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}"

      # SEC-23 — an SBOM with pinned dependencies. npm produces CycloneDX
      # itself, so this adds no dependency to produce the document that lists
      # our dependencies.
      - name: Software bill of materials
        run: |
          set -euo pipefail
          mkdir -p dist
          npm sbom --sbom-format cyclonedx --sbom-type library --omit dev > dist/sbom.cyclonedx.json
          node -e '
            const s = require("./dist/sbom.cyclonedx.json");
            const n = (s.components || []).length;
            if (!s.bomFormat || !s.specVersion) throw new Error("not a CycloneDX document");
            console.log(`SBOM: ${s.bomFormat} ${s.specVersion}, ${n} component(s)`);
          '

      - name: Pack every workspace
        run: |
          set -euo pipefail
          npm pack --workspaces --pack-destination dist
          ls -l dist
          ( cd dist && sha256sum *.tgz sbom.cyclonedx.json > SHA256SUMS )
          cat dist/SHA256SUMS

      # SEC-22 — the attestation binds each tarball's digest to this commit and
      # this workflow. Verify with:
      #   gh attestation verify <file.tgz> --repo splitstick/splitstick
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*.tgz'

      - name: Attest the SBOM
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/sbom.cyclonedx.json'

      # npm's own provenance attestation, which is what shows on the package
      # page. publishConfig.provenance is set in each workspace manifest, so the
      # flag here is belt and braces rather than the only thing asking for it.
      # A CONSUMER INSTALL, before anything irreversible.
      #
      # Every check above this runs inside the monorepo, where a workspace link
      # resolves what a user's install would have to fetch. That is how
      # `@splitstick/witnesses` once imported a package it did not declare, and
      # how the only published bin printed nothing when installed. Packing the
      # tarballs and installing them into a project with no workspace is the
      # only step that exercises what a first-time user actually gets.
      - name: Install the packed tarballs into a clean project
        run: node tools/smoke-install.mjs dist

      # THE RELEASE IS CREATED AS A DRAFT BEFORE npm publish, and the artifacts
      # are attached to it before npm publish, because `npm publish` is the one
      # irreversible step in this workflow.
      #
      # The previous order published to npm and THEN called `gh release upload`
      # against a release nothing had created — GitHub does not create a Release
      # when a tag is pushed. The upload would have failed with the packages
      # already public and unretractable, leaving no checksums, no SBOM and no
      # tarballs attached to anything.
      - name: Create or reuse a draft GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; reusing it"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft --title "${GITHUB_REF_NAME}" \
              --notes "Artifacts and checksums are attached. See docs/ for the release notes."
          fi

      - name: Attach artifacts to the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tgz dist/sbom.cyclonedx.json dist/SHA256SUMS --clobber

      - name: Publish to npm with provenance
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspaces --provenance --access public

      # Last, so a release stops being a draft only once the packages it
      # describes are actually on the registry. A draft left behind by a failed
      # run is visible to maintainers and invisible to everybody else, which is
      # the right way round for a half-finished release.
      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
